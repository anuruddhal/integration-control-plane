plugins {
    id 'java'
}

group = 'org.wso2.icp'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
    }
}

configurations {
    miDistribution
    jacocoAgent
}

def resolvedMiVersion = providers.gradleProperty('miVersion').orElse('latest.release')

def dockerContextHost() {
    def context = commandOutput('docker', 'context', 'show')
    context ? commandOutput('docker', 'context', 'inspect', '--format', '{{.Endpoints.docker.Host}}', context) : ''
}

def commandOutput(String... args) {
    def output = new ByteArrayOutputStream()
    try {
        def result = exec {
            commandLine args
            standardOutput = output
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? output.toString().trim() : ''
    } catch (Exception ignored) {
        return ''
    }
}

dependencies {
    testImplementation 'com.microsoft.playwright:playwright:1.49.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
    testImplementation 'org.jacoco:org.jacoco.core:0.8.12'
    testImplementation 'org.jacoco:org.jacoco.report:0.8.12'

    miDistribution "org.wso2.ei:wso2mi:${resolvedMiVersion.get()}@zip"
    jacocoAgent 'org.jacoco:org.jacoco.agent:0.8.12:runtime'
}

tasks.register('resolveMiDistribution') {
    group = 'verification'
    description = 'Resolve the MI distribution used by self-contained E2E tests.'
    outputs.files(configurations.miDistribution)
    doLast {
        configurations.miDistribution.files.each { file ->
            logger.lifecycle("Resolved MI distribution: ${file.name}")
        }
    }
}

tasks.register('buildBiE2eArtifact') {
    group = 'verification'
    description = 'Build the BI E2E artifact from source kept inside ./icp.'
    inputs.dir('src/test/resources/bi/hello-world')
    outputs.file(layout.buildDirectory.file('bi/hello-world/target/bin/icp_e2e_hello_world.jar'))
    // Two concurrent `bal build`s corrupt the shared ~/.ballerina cache; serialize after the ICP build.
    mustRunAfter rootProject.tasks.named('buildICP')

    doLast {
        def workDir = layout.buildDirectory.dir('bi/hello-world').get().asFile
        delete workDir
        copy {
            from 'src/test/resources/bi/hello-world'
            into workDir
        }
        exec {
            workingDir workDir
            commandLine 'bal', 'build'
        }
    }
}

test {
    useJUnitPlatform()

    // Forward local Docker/Testcontainers config. Docker CLI contexts are not env vars, so pass them explicitly.
    def dockerHost = System.getenv('DOCKER_HOST') ?: dockerContextHost()
    if (dockerHost) environment 'DOCKER_HOST', dockerHost
    ['TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', 'TESTCONTAINERS_RYUK_DISABLED'].each { key ->
        if (System.getenv(key)) environment key, System.getenv(key)
    }
    if (!System.getenv('TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE') && dockerHost?.startsWith('unix://')) {
        environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
    }
    // docker-java negotiates too low an API version for some daemons (e.g. Colima); pin a supported one.
    if (dockerHost) systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.41'

    dependsOn rootProject.tasks.named('packageICP')
    dependsOn tasks.named('resolveMiDistribution')
    dependsOn tasks.named('buildBiE2eArtifact')
    dependsOn 'playwrightInstall'

    systemProperties System.getProperties().findAll { key, _ -> key.toString().startsWith('icp.e2e.') }
    def coverageEnabled = System.getProperty('icp.e2e.coverage', 'true')
    systemProperty 'icp.e2e.selfContained', System.getProperty('icp.e2e.selfContained', 'true')
    systemProperty 'icp.e2e.observability', System.getProperty('icp.e2e.observability', 'true')
    systemProperty 'icp.e2e.sso', System.getProperty('icp.e2e.sso', 'true')
    systemProperty 'icp.e2e.coverage', coverageEnabled
    systemProperty 'icp.e2e.distributionZip', rootProject.layout.buildDirectory.file("distribution/wso2-integration-control-plane-${rootProject.version}.zip").get().asFile.absolutePath
    systemProperty 'icp.e2e.workDir', layout.buildDirectory.dir('runtime').get().asFile.absolutePath
    doFirst {
        systemProperty 'icp.e2e.miZip', configurations.miDistribution.singleFile.absolutePath
        systemProperty 'icp.e2e.biJar', layout.buildDirectory.file('bi/hello-world/target/bin/icp_e2e_hello_world.jar').get().asFile.absolutePath
        systemProperty 'icp.e2e.reportDir', layout.buildDirectory.dir('reports/e2e').get().asFile.absolutePath
        // Ballerina compiles to JVM bytecode carrying .bal SourceFile/line info, so the JaCoCo agent
        // on the packaged ICP process yields Ballerina line coverage. Resolve the agent only when needed.
        if (coverageEnabled == 'true') {
            systemProperty 'icp.e2e.jacocoAgentJar', configurations.jacocoAgent.singleFile.absolutePath
        }
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Pure merge step: unions whatever JaCoCo dumps already exist into one report. It does NOT run either
// test suite — those own their own infra (E2E is self-contained; unit tests need the MySQL from
// docker-compose.test.yml). All dumps and the jar MUST come from the same source and Ballerina
// toolchain, or JaCoCo drops the mismatched class ids. Paths are overridable via -P properties.
tasks.register('combinedCoverageReport', JavaExec) {
    group = 'verification'
    description = 'Merge existing E2E and Ballerina unit-test JaCoCo dumps into one line-coverage report.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.wso2.icp.e2e.CombinedCoverageReport'
    def jar = providers.gradleProperty('icp.coverage.jar')
            .getOrElse(rootProject.file('icp_server/target/bin/icp_server.jar').absolutePath)
    mustRunAfter rootProject.tasks.named('testICP')
    mustRunAfter tasks.named('test')
    def e2eExec = providers.gradleProperty('icp.coverage.e2eExec')
            .getOrElse(layout.buildDirectory.file('reports/e2e/coverage/jacoco.exec').get().asFile.absolutePath)
    def unitExec = providers.gradleProperty('icp.coverage.unitExec')
            .getOrElse(rootProject.file('icp_server/target/cache/tests_cache/coverage/ballerina.exec').absolutePath)
    // A "combined" report needs both dumps. Skip (don't fail) when either is absent — e.g. a
    // unit-only `build -x :e2e-tests:test` — so it never emits a one-suite report.
    onlyIf {
        [e2eExec, unitExec].every { path -> def d = file(path); d.exists() && d.length() > 0 }
    }
    // Optional CI gate: -Picp.coverage.min=NN fails the build below that line-coverage percentage.
    providers.gradleProperty('icp.coverage.min').map { systemProperty 'icp.coverage.min', it }.getOrNull()
    args jar,
            rootProject.file('icp_server').absolutePath,
            layout.buildDirectory.dir('reports/combined/coverage').get().asFile.absolutePath,
            e2eExec,
            unitExec
}

tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Install Playwright browsers used by the Java E2E tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('playwrightInstallDeps', JavaExec) {
    group = 'verification'
    description = 'Install Playwright browsers plus OS dependencies (Linux/CI).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}
