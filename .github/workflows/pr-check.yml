name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, test and coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # setup-ballerina downloads from dist.ballerina.io, which does not carry pre-release
      # builds — it answers 403 for 2201.14.0-alpha2 — so the action cannot install this
      # version. Install the .deb from the GitHub release instead. Note the asset is named
      # for the base version, without the -alpha2 the tag carries. The package puts `bal`
      # on PATH itself (/usr/bin/bal), so nothing needs exporting. Restore the action once
      # a non-pre-release build is published.
      - name: Setup Ballerina
        env:
          BALLERINA_TAG: v2201.14.0-alpha2
          BALLERINA_DEB: ballerina-2201.14.0-swan-lake-linux-x64.deb
        run: |
          set -euo pipefail
          curl -fLsS -o "$BALLERINA_DEB" \
            "https://github.com/ballerina-platform/ballerina-distribution/releases/download/${BALLERINA_TAG}/${BALLERINA_DEB}"
          sudo dpkg -i "$BALLERINA_DEB"
          rm -f "$BALLERINA_DEB"
          bal version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Check Prettier formatting
        run: |
          cd frontend
          npx prettier --check .

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # OpenSearch (E2E observability) needs a higher mmap count than the runner default.
      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Build (unit on H2 + E2E on MySQL + combined coverage)
        # A single `build` runs the Ballerina unit tests (self-contained H2, no MySQL) and the E2E
        # suite (MySQL via Testcontainers), then emits the combined line-coverage report from both
        # dumps. Add -Picp.coverage.min=<pct> to gate on combined coverage.
        run: ./gradlew --no-daemon -PplaywrightWithDeps build

      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: combined-coverage
          path: e2e-tests/build/reports/combined/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reports
          path: |
            e2e-tests/build/reports/
            e2e-tests/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
